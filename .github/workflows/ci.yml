name: AIOTrade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [engine, web]
    env:
      AIOTRADE_HTTP_PORT: "8088"
      AIOTRADE_HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@v4
      - name: Tests sur le bytecode seul, dans le conteneur
        run: docker build --target test engine
      - name: Build et démarrage de la stack
        run: |
          docker compose up -d --build --wait
          curl -fsS http://localhost:8088/api/health
          curl -fsS -o /dev/null http://localhost:8088/
          curl -fsS -X POST http://localhost:8088/api/simulate -H 'Content-Type: application/json' -d '{}' > /dev/null
          curl -fsS -o /dev/null http://localhost:8088/api/benchmark
          curl -fsS http://localhost:8088/metrics/engine.json | grep -q '"simulations_served":1'
      - name: Cloisonnement des conteneurs
        run: |
          # Aucune source Python dans l'image du moteur, seulement du bytecode
          test "$(docker compose exec -T aiotrade-engine sh -c 'find /app -name "*.py" | wc -l')" = "0"
          # Aucun port du moteur publié sur l'hôte
          # (selon la version de Compose : sortie « :0 » ou erreur « no port » ; jamais un vrai port)
          if docker compose port aiotrade-engine 8000 2>/dev/null | grep -q ':[1-9]'; then exit 1; fi
          test -z "$(docker inspect -f '{{range $p, $b := .NetworkSettings.Ports}}{{if $b}}{{$p}}{{end}}{{end}}' "$(docker compose ps -q aiotrade-engine)")"
          # Aucun accès sortant depuis le moteur (réseau internal-net)
          if docker compose exec -T aiotrade-engine python -c "import urllib.request; urllib.request.urlopen('https://github.com', timeout=5)"; then exit 1; fi
          # Volume de métriques en lecture seule côté site
          if docker compose exec -T aiotrade-web touch /srv/metrics/essai; then exit 1; fi
      - name: Arrêt
        if: always()
        run: docker compose down -v
