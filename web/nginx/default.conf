# AIOTrade : seul service exposé. HTTP sur 8080, HTTPS sur 8443 dès que des
# certificats sont montés dans /etc/nginx/certs (voir 40-aiotrade-tls.sh).

# HSTS envoyé uniquement en HTTPS (une valeur vide n'émet pas l'en-tête).
map $scheme $aiotrade_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    # Redirection vers HTTPS quand un certificat est présent (fichier généré au démarrage).
    include /etc/nginx/aiotrade/http-mode.conf;
    include /etc/nginx/snippets/site.conf;
}

# Serveur HTTPS (fichier généré au démarrage : vide si aucun certificat n'est monté).
include /etc/nginx/aiotrade/tls-server.conf;

# Sonde de santé interne au conteneur, jamais publiée.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
