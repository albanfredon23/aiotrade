# Contenu commun aux serveurs HTTP et HTTPS.
server_name _;
root /usr/share/nginx/html;
index index.html;
server_tokens off;
charset utf-8;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

# API du moteur AIOTrade, joignable uniquement par le réseau interne (même origine : pas de CORS).
location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://aiotrade-engine:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 16k;
}

# Métriques publiées par le moteur dans le volume partagé (monté en lecture seule).
# Liste blanche : aucun autre fichier du volume n'est servi.
location ~ ^/metrics/(?<metrics_file>(engine|trader|benchmark)\.json)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    alias /srv/metrics/$metrics_file;
}

location /metrics/ {
    return 404;
}

# Fichiers versionnés par Vite : cache long.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
