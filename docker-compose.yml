# AIOTrade : deux services cloisonnés, démarrage en une commande
#   docker compose up --build        puis http://localhost
#
#   aiotrade-engine  moteur Python (bytecode seul), aucun port publié, réseau interne
#                    uniquement ; écrit ses métriques dans le volume « metrics ».
#   aiotrade-web     site et tableau de bord, seul service exposé (80 / 443) ; lit
#                    les métriques en lecture seule et relaie /api vers le moteur.
#
# Exécutant de trading (désactivé par défaut, profil « trading ») :
#   docker compose --profile trading up -d aiotrade-trader
# Mode papier par défaut. Il est seul à avoir un accès sortant (réseau egress-net),
# nécessaire pour joindre le courtier ; le moteur de l'API n'en a jamais.
name: aiotrade

services:
  aiotrade-engine:
    build:
      context: ./engine
      target: runtime
    restart: unless-stopped
    networks: [internal-net]
    # Aucun « ports » ni « expose » vers l'hôte : joignable seulement depuis internal-net.
    environment:
      AIOTRADE_METRICS_DIR: /data/metrics
    volumes:
      - metrics:/data/metrics
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  aiotrade-web:
    build: ./web
    restart: unless-stopped
    depends_on:
      aiotrade-engine:
        condition: service_healthy
    networks: [internal-net, public-net]
    ports:
      - "${AIOTRADE_HTTP_PORT:-80}:8080"
      - "${AIOTRADE_HTTPS_PORT:-443}:8443"
    volumes:
      - metrics:/srv/metrics:ro
      - ${AIOTRADE_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /etc/nginx/aiotrade
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]  # nginx : processus maître root, workers non privilégiés
    security_opt:
      - no-new-privileges:true

  aiotrade-trader:
    profiles: ["trading"]
    build:
      context: ./engine
      target: runtime
    restart: unless-stopped
    networks: [egress-net]
    command:
      - python
      - -m
      - aiotrade
      - trade
      - --broker
      - ${AIOTRADE_BROKER:-paper}
      - --symbol
      - ${AIOTRADE_SYMBOL:-BTCUSDT}
      - --ledger
      - /data/ledger/decisions.jsonl
      - --loop
    environment:
      AIOTRADE_METRICS_DIR: /data/metrics
      # Les clés restent dans votre fichier .env local (jamais versionné) ou votre gestionnaire de secrets.
      AIOTRADE_BINANCE_ENV: ${AIOTRADE_BINANCE_ENV:-testnet}
      AIOTRADE_BINANCE_API_KEY: ${AIOTRADE_BINANCE_API_KEY:-}
      AIOTRADE_BINANCE_API_SECRET: ${AIOTRADE_BINANCE_API_SECRET:-}
      AIOTRADE_SEND_ORDERS: ${AIOTRADE_SEND_ORDERS:-0}
      AIOTRADE_MAX_ORDER_NOTIONAL: ${AIOTRADE_MAX_ORDER_NOTIONAL:-1000}
      AIOTRADE_LIVE_TRADING: ${AIOTRADE_LIVE_TRADING:-}
      AIOTRADE_BINANCE_LIVE_API_KEY: ${AIOTRADE_BINANCE_LIVE_API_KEY:-}
      AIOTRADE_BINANCE_LIVE_API_SECRET: ${AIOTRADE_BINANCE_LIVE_API_SECRET:-}
    volumes:
      - metrics:/data/metrics
      - trader-ledger:/data/ledger
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  internal-net:
    internal: true  # aucun accès sortant, aucun port publiable
  public-net: {}
  egress-net: {}

volumes:
  metrics:
  trader-ledger:
